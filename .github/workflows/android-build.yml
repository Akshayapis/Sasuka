name: Android app build

# U APP PLATFORM build workflow. Add this file to the platform's own build
# repository. The platform token lives only in deployment env variables —
# end users never see or provide any GitHub credential.
# U APP dispatches this workflow with workflow_dispatch; builds typically take 3–6 minutes.
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: U APP project ID
        required: true
      package_id:
        description: Android package ID
        required: true
      build_type:
        description: Debug APK, Release APK or AAB
        required: true
        default: Debug APK
      source_url:
        description: Website URL or short-lived signed source ZIP URL
        required: false

permissions:
  contents: read

concurrency:
  group: uapp-${{ github.event.inputs.project_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PACKAGE_ID: ${{ github.event.inputs.package_id }}
      SOURCE_URL: ${{ github.event.inputs.source_url }}
      BUILD_TYPE: ${{ github.event.inputs.build_type }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          echo "Project: ${{ github.event.inputs.project_id }}"
          echo "Package: $PACKAGE_ID"
          echo "Build:   $BUILD_TYPE"
          [[ "$PACKAGE_ID" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]] || { echo "Invalid package ID" >&2; exit 1; }
          [[ "$SOURCE_URL" =~ ^https:// ]] || { echo "A valid HTTPS source_url is required" >&2; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Prepare Android project
        run: |
          set -euo pipefail
          PKG_PATH=$(echo "$PACKAGE_ID" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH" app/src/main/res/values app/src/main/res/layout
          case "$SOURCE_URL" in
            *.zip)
              curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 \
                --max-filesize 500000000 "$SOURCE_URL" --output source.zip
              unzip -Z1 source.zip | grep -Eq '(^|/)\.\.(/|$)' && { echo "Unsafe archive path" >&2; exit 1; }
              unzip -q source.zip -d incoming
              cp -R incoming/. app/src/main/assets/ 2>/dev/null || mkdir -p app/src/main/assets
              ;;
            *)
              mkdir -p app/src/main/assets/www
              cat > app/src/main/assets/www/index.html <<HTML
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>${{ github.event.inputs.project_id }}</title>
          <style>html,body,iframe{height:100%;width:100%;margin:0;border:0}body{background:#080a0d}</style>
          </head><body>
          <iframe src="${SOURCE_URL}" title="App" allow="camera; microphone; geolocation; fullscreen"
            referrerpolicy="no-referrer-when-downgrade"></iframe>
          </body></html>
          HTML
              ;;
          esac

          cat > settings.gradle <<'EOF'
          rootProject.name = "UappGenerated"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.5.2"; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24" }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'

          android {
              namespace PLACEHOLDER_NAMESPACE
              compileSdk 34
              defaultConfig {
                  applicationId PLACEHOLDER_PACKAGE
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation "androidx.appcompat:appcompat:1.7.0"
          }
          EOF

          sed -i "s|PLACEHOLDER_PACKAGE|\"$PACKAGE_ID\"|g; s|PLACEHOLDER_NAMESPACE|\"$PACKAGE_ID\"|g" app/build.gradle

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application android:label="U APP" android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "app/src/main/java/$PKG_PATH/MainActivity.kt" <<'EOF'
          package PACKAGE_PLACEHOLDER

          import android.annotation.SuppressLint
          import android.os.Bundle
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var web: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.allowFileAccess = true
                  web.webViewClient = WebViewClient()
                  web.webChromeClient = WebChromeClient()
                  web.loadUrl("file:///android_asset/www/index.html")
                  setContentView(web)
              }

              override fun onBackPressed() {
                  if (::web.isInitialized && web.canGoBack()) web.goBack() else super.onBackPressed()
              }
          }
          EOF
          sed -i "s|PACKAGE_PLACEHOLDER|$PACKAGE_ID|g" "app/src/main/java/$PKG_PATH/MainActivity.kt"
          echo "Project generated for $PACKAGE_ID"

      - name: Build APK
        run: |
          set -euo pipefail
          if [ "$BUILD_TYPE" = "AAB" ]; then
            gradle bundleRelease --no-daemon --stacktrace
          elif [ "$BUILD_TYPE" = "Release APK" ]; then
            gradle assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          find . -path ./out -prune -o -type f \( -name '*.apk' -o -name '*.aab' \) -print -exec cp {} out/ \;
          find app/src/main -name AndroidManifest.xml -exec grep -o 'android.permission.[A-Z_]*' {} \; | sort -u > out/permission-report.txt || true
          ls -lh out/

      - name: Upload real build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uapp-${{ github.event.inputs.project_id }}
          path: out/
          retention-days: 1
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: echo "U APP build ${{ job.status }} for ${{ github.event.inputs.project_id }}"
